# PLAN.md stage D2: fine-tune HF ViTPose(++) on SyRIP with tools/train_vitpose.py.
# Data/augmentation/test settings copied from experiments/coco/hrnet/w48_384x288_adam_lr1e-3_infant.yaml;
# input 256x192 / heatmap 64x48 / sigma 2 as in ViTPose's COCO training.
AUTO_RESUME: false
CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true
DATA_DIR: ''
GPUS: (0,)
OUTPUT_DIR: 'output'
LOG_DIR: 'log'
WORKERS: 6
PRINT_FREQ: 20

DATASET:
  COLOR_RGB: true
  DATASET: 'syrip'
  DATA_FORMAT: jpg
  FLIP: true
  NUM_JOINTS_HALF_BODY: 8
  PROB_HALF_BODY: 0.3
  ROOT: 'data/syrip/'
  ROT_FACTOR: 45
  SCALE_FACTOR: 0.35
  TEST_SET: 'validate_infant'
  TRAIN_SET: 'train_infant'
  TRAIN_PRE_SET: 'train_pre_infant'
MODEL:
  NAME: adaptive_pose_vitpose
  HF_NAME: 'usyd-community/vitpose-plus-large'
  INIT_WEIGHTS: true
  NUM_JOINTS: 17
  TARGET_TYPE: gaussian
  IMAGE_SIZE:
  - 192
  - 256
  HEATMAP_SIZE:
  - 48
  - 64
  SIGMA: 2
LOSS:
  USE_TARGET_WEIGHT: true
TRAIN:
  BATCH_SIZE_PER_GPU: 32
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 40
  OPTIMIZER: adamw
  LR: 0.00005
  LR_FACTOR: 0.1
  LR_STEP:
  - 30
  WD: 0.1
  LAYER_DECAY: 1.0
TEST:
  BATCH_SIZE_PER_GPU: 32
  BBOX_THRE: 1.0
  IMAGE_THRE: 0.0
  IN_VIS_THRE: 0.2
  MODEL_FILE: ''
  NMS_THRE: 1.0
  OKS_THRE: 0.9
  USE_GT_BBOX: true
  FLIP_TEST: true
  POST_PROCESS: true
  BLUR_KERNEL: 11
DEBUG:
  DEBUG: false
